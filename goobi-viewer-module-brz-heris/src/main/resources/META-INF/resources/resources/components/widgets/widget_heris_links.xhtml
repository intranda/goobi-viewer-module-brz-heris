<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <!-- Sidebar contribution, included via ui:include by the core (see HerisModule#getSidebarContributions) -->
    <ui:param
        name="herisLinks"
        value="#{herisBean.externalLinks}" />
    <h:panelGroup
        id="widgetHerisLinks"
        layout="block"
        styleClass="widget widget-heris-links"
        rendered="#{not empty herisLinks}">
        <div class="widget__topbar widget-heris-links__topbar">
            <h2 class="widget__title widget-heris-links__title">#{msgheris.widgetTitle}</h2>
        </div>
        <div class="widget__body widget-heris-links__body">
            <ul>
                <ui:repeat
                    var="link"
                    value="#{herisLinks}">
                    <li>
                        <a
                            href="#{link.one}"
                            target="_blank"
                            rel="noopener noreferrer">#{link.two}</a>
                    </li>
                </ui:repeat>
            </ul>
        </div>
    </h:panelGroup>

</ui:composition>
